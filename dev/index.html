<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daybook preview</title>
<style>
  body { margin:0; }
  :root { --primary-background-color:#fafafa; --card-background-color:#fff; --primary-text-color:#212121; --secondary-text-color:#727272;
    --divider-color:rgba(0,0,0,.12); --primary-color:#03a9f4; --text-primary-color:#fff; --secondary-background-color:#f0f0f0; --error-color:#db4437; }
  @media (prefers-color-scheme: dark) { :root { --primary-background-color:#111111; --card-background-color:#1c1c1c; --primary-text-color:#e1e1e1;
    --secondary-text-color:#9b9b9b; --divider-color:rgba(255,255,255,.12); --secondary-background-color:#282828; } }
</style></head>
<body><daybook-panel></daybook-panel>
<script type="module">
  import "/custom_components/daybook/frontend/daybook-panel.js";
  const states = await (await fetch("/hass-states.json")).json();
  const hass = {
    states,
    services: { notify: { mobile_app_phone: {} } },
    callWS: async (msg) => {
      const r = await fetch("/ws", { method: "POST", body: JSON.stringify(msg) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.message);
      return j;
    },
    connection: { subscribeMessage: async () => () => {} },
  };
  const el = document.querySelector("daybook-panel");
  el.narrow = window.innerWidth < 870;
  el.hass = hass;
</script></body></html>
