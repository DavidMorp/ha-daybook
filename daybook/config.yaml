name: Daybook
version: "0.2.0"
slug: daybook
description: A private journal for what you take, how you feel and sport, with patterns over time
url: https://github.com/DavidMorp/ha-daybook
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:notebook-heart-outline
panel_title: Daybook
panel_admin: true
homeassistant_api: true
services:
  - mqtt:want
backup: hot
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
