name: Daybook
version: "0.4.0"
slug: daybook
description: A private journal for what you take, how you feel and sport, with patterns over time
url: https://github.com/DavidMorp/ha-daybook
arch:
  - aarch64
  - amd64
init: false
# The panel uses the default ingress port (8099) and is admin only by default.
ingress: true
panel_icon: mdi:notebook-heart-outline
panel_title: Daybook
homeassistant_api: true
services:
  - mqtt:want
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
